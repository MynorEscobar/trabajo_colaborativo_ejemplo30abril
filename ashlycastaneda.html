<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashly Castañeda - Portafolio</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f8ff;
        }

        .navbar-custom {
            background: linear-gradient(135deg, #0d6efd 0%, #0dcaf0 100%);
        }

        .navbar-brand {
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
        }

        .navbar-custom .nav-link:hover {
            color: #ffffff;
        }

        .hero-section {
            padding: 100px 0;
            background: linear-gradient(rgba(13, 110, 253, 0.05), rgba(13, 202, 240, 0.1)), url('https://images.unsplash.com/photo-1550439062-609e1531270e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover;
            position: relative;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(13, 110, 253, 0.15);
            transform: translateY(0);
            transition: all 0.3s ease;
        }

        .text-gradient {
            background: linear-gradient(135deg, #0d6efd 0%, #0dcaf0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .footer-custom {
            background: #0a2540;
            color: #adbac7;
            padding: 40px 0;
            margin-top: 60px;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="bi bi-hexagon-fill me-2"></i>Ashly Castañeda</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <i class="bi bi-list text-white fs-3"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Inicio</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="container">
            <div class="row justify-content-center align-items-center">
                <div class="col-lg-8 text-center">
                    <div class="glass-card">
                        <span class="badge bg-primary rounded-pill px-3 py-2 mb-3 shadow-sm">Bienvenido a mi
                            espacio</span>
                        <h1 class="display-4 fw-bold mb-4">Hola, soy <span class="text-gradient">Ashly Castañeda</span>
                        </h1>
                        <p class="lead mb-5 text-muted">Diseñando experiencias digitales modernas, fluidas y elegantes.
                            Transformando ideas en soluciones tecnológicas brillantes.</p>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <footer class="footer-custom text-center">
        <div class="container">
            <p class="mb-2">&copy; 2026 Ashly Castañeda. Todos los derechos reservados.</p>
            <div>
                <a href="#" class="text-white text-decoration-none me-3"><i class="bi bi-github fs-4"></i></a>
                <a href="#" class="text-white text-decoration-none me-3"><i class="bi bi-linkedin fs-4"></i></a>
                <a href="#" class="text-white text-decoration-none"><i class="bi bi-twitter-x fs-4"></i></a>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
